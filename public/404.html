<!doctype html>
<!-- GitHub Pages serves this file for any path that doesn't exist. It stands alone (no React),
     so links and assets use absolute paths: the visitor may be at any depth, e.g. /old/page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <title>Page not found · Daniel Rodriguez</title>
    <meta name="description" content="This page doesn’t exist on danrod.ca. Go to the home page to see Daniel Rodriguez’s work, blog and contact form." />
    <script>
      // Same theme and language as the main site: saved choice first, then dark / the browser language.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'
        var lang = localStorage.getItem('lang')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
      if (!lang) lang = navigator.language && navigator.language.toLowerCase().startsWith('es') ? 'es' : 'en'
      document.documentElement.lang = lang
    </script>
    <style>
      :root {
        --bg: #0a0e1a;
        --surface: rgba(255, 255, 255, 0.035);
        --border: rgba(148, 163, 184, 0.14);
        --border-strong: rgba(148, 163, 184, 0.3);
        --text: #e6e9f2;
        --muted: #8b95ad;
        --accent: #38bdf8;
        --accent-2: #818cf8;
        --accent-3: #34d399;
        --accent-rgb: 56, 189, 248;
        --error: #f87171;
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        --bg: #f7f8fc;
        --surface: rgba(255, 255, 255, 0.85);
        --border: rgba(15, 23, 42, 0.1);
        --border-strong: rgba(15, 23, 42, 0.22);
        --text: #0f172a;
        --muted: #5b6478;
        --accent: #0284c7;
        --accent-2: #4f46e5;
        --accent-3: #059669;
        --accent-rgb: 2, 132, 199;
        --error: #dc2626;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background:
          radial-gradient(600px 400px at 80% 10%, rgba(var(--accent-rgb), 0.12), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 640px;
        text-align: center;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .logo {
        display: inline-block;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
        margin-bottom: 28px;
      }
      .gradient-text {
        background: linear-gradient(100deg, var(--accent), var(--accent-2) 60%, var(--accent-3));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .code {
        font-size: clamp(88px, 22vw, 150px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        margin: 0;
      }
      h1 {
        font-size: clamp(24px, 5vw, 32px);
        margin: 12px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0;
      }
      .terminal {
        margin: 28px 0 32px;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        text-align: left;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .terminal .prompt {
        color: var(--accent-3);
      }
      .terminal .err {
        color: var(--error);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid transparent;
        transition: transform 0.2s, border-color 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .btn--primary {
        background: linear-gradient(100deg, var(--accent), var(--accent-2));
        color: #fff;
        box-shadow: 0 10px 30px -10px rgba(var(--accent-rgb), 0.7);
      }
      .btn--ghost {
        background: var(--surface);
        border-color: var(--border-strong);
        color: var(--text);
      }
      .btn--ghost:hover {
        border-color: var(--accent);
      }
      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
        .btn:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/" class="logo mono"><span>~/</span><span class="gradient-text">danrod</span></a>
      <p class="code gradient-text" aria-hidden="true">404</p>
      <h1 data-i18n="title">Page not found</h1>
      <p data-i18n="body">The page you’re looking for doesn’t exist or has moved.</p>
      <div class="terminal mono" aria-hidden="true">
        <div><span class="prompt">danrod@web:~$</span> cd <span id="path">/</span></div>
        <div class="err" data-i18n="error">bash: cd: No such file or directory</div>
      </div>
      <div class="actions">
        <a class="btn btn--primary" href="/" data-i18n="home">Go to the home page</a>
        <a class="btn btn--ghost" href="/#work" data-i18n="work">See my work</a>
        <a class="btn btn--ghost" href="/#contact" data-i18n="contact">Contact me</a>
      </div>
    </main>
    <script>
      var es = {
        title: 'Página no encontrada',
        body: 'La página que buscas no existe o se movió.',
        error: 'bash: cd: No existe el archivo o el directorio',
        home: 'Ir a la página de inicio',
        work: 'Ver mi trabajo',
        contact: 'Contáctame',
      }
      document.getElementById('path').textContent = location.pathname
      if (document.documentElement.lang === 'es') {
        document.title = 'Página no encontrada · Daniel Rodriguez'
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = es[el.dataset.i18n]
        })
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG versions of favicon.svg for iOS home screens and Android (site.webmanifest), with a square background
         since those systems round the corners themselves. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- English defaults. scripts/prerender.js copies this file for each post and the privacy page with their own title,
         description and URLs; in the browser the app swaps them for the visitor's language (src/strings.js, src/meta.js). -->
    <title>Daniel Rodriguez · Drupal &amp; Web Developer</title>
    <meta name="description" content="Daniel Rodriguez, Full Stack Drupal and Web Developer: 15+ years of Drupal sites, contrib modules used on 217k+ sites, DevOps and Linux." />
    <link rel="canonical" href="https://danrod.ca/" />
    <meta property="og:title" content="Daniel Rodriguez · Drupal &amp; Web Developer" />
    <meta property="og:description" content="15+ years building Drupal sites, contrib modules used on 217k+ sites, and open source tools." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://danrod.ca/" />
    <meta property="og:site_name" content="danrod" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:locale:alternate" content="es_CO" />
    <!-- public/og-image.jpg: link preview for social sites and chat apps (1200×630). Absolute URL, as crawlers require. -->
    <meta property="og:image" content="https://danrod.ca/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daniel Rodriguez, Full Stack Drupal &amp; Web Developer: name, skills (Drupal 6 to 11, React, PHP, DevOps, Linux) and a portrait on a dark background" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts are served from this site (public/fonts/). Preloading the latin files avoids a flash of the fallback font. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- The home page ships its sections as HTML (src/entry-server.jsx); without JavaScript nothing would fade them in. -->
    <noscript><style>.reveal { opacity: 1; transform: none; }</style></noscript>
    <link rel="alternate" type="application/rss+xml" title="danrod · Blog" href="https://danrod.ca/feed.xml" />
    <!-- Who the site is about, for search engines. Keep sameAs in step with profile.links in src/data.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://danrod.ca/#person",
        "name": "Daniel Rodriguez",
        "jobTitle": "Full Stack Drupal and Web Developer",
        "description": "Full Stack Drupal and Web Developer with 15+ years of Drupal sites and contrib modules used on 217k+ sites.",
        "url": "https://danrod.ca/",
        "image": "https://danrod.ca/og-image.jpg",
        "knowsAbout": ["Drupal", "PHP", "React", "JavaScript", "DevOps", "Linux", "Scilab"],
        "knowsLanguage": ["en", "es"],
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Universidad Industrial de Santander" },
        "sameAs": [
          "https://github.com/danrod96-new",
          "https://github.com/danrod96",
          "https://www.drupal.org/u/danrod",
          "https://www.linkedin.com/in/daniel-rodriguez-38951884/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
